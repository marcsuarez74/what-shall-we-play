# Crée la Release GitHub quand un tag v* est poussé :
# les notes sont extraites de la section correspondante du CHANGELOG.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extraire les notes du CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          # strip du lien de comparaison de fin (lignes [x.y.z]: url) hors notes
          sed -i '' '/^\[/d' notes.md 2>/dev/null || sed -i '/^\[/d' notes.md
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent : si la release existe déjà (créée en parallèle du push du tag,
          # ou relance après échec), on ignore au lieu d'échouer en HTTP 422.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::La release $GITHUB_REF_NAME existe déjà — étape ignorée."
            exit 0
          fi
          # --notes-file (et pas --notes) : les backticks des notes ne doivent
          # jamais être interprétés comme de la substitution de commande par bash.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
