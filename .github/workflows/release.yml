# Crée la Release GitHub quand un tag v* est poussé :
# les notes sont extraites de la section correspondante du CHANGELOG.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extraire les notes du CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          # strip du lien de comparaison de fin (lignes [x.y.z]: url) hors notes
          sed -i '' '/^\[/d' notes.md 2>/dev/null || sed -i '/^\[/d' notes.md
          {
            echo "body<<EOF"
            cat notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "${{ steps.notes.outputs.body }}"
