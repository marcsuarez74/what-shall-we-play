# Crée la Release GitHub d'un tag v* : les notes sont extraites de la section
# correspondante du CHANGELOG. Appelé par la CI après le déploiement sur main
# (tag posé automatiquement — un tag poussé par GITHUB_TOKEN ne déclenche aucun
# workflow, d'où l'appel explicite), ou déclenché par un tag poussé à la main.
name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extraire les notes du CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > notes.md
          # strip du lien de comparaison de fin (lignes [x.y.z]: url) hors notes
          sed -i '' '/^\[/d' notes.md 2>/dev/null || sed -i '/^\[/d' notes.md
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent : si la release existe déjà (créée en parallèle du push du tag,
          # ou relance après échec), on ignore au lieu d'échouer en HTTP 422.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::La release $TAG existe déjà — étape ignorée."
            exit 0
          fi
          # --notes-file (et pas --notes) : les backticks des notes ne doivent
          # jamais être interprétés comme de la substitution de commande par bash.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md
