name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filtre.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Détecter une modification purement docs
        id: filtre
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            FICHIERS=$(gh pr diff --name-only "$PR_NUMBER" 2>/dev/null || true)
          else
            # push sur main = commit de fusion : diff contre le parent (les fichiers de la PR)
            FICHIERS=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
          fi
          # Détection impossible → par sécurité, CI complète (docs=false)
          if [ -z "$FICHIERS" ]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "Détection impossible — CI complète par sécurité."
            exit 0
          fi
          echo "Fichiers modifiés :"
          echo "$FICHIERS"
          # docs-only ⇐ tous les fichiers sont .md, sous docs/, captures-maquette/ ou mockup/
          if echo "$FICHIERS" | grep -qvE '(^|/)[^/]+\.md$|^docs/|^captures-maquette/|^mockup/'; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "→ Modification purement docs : build, tests et déploiement sautés."
          fi

  # Build et tests : sur la PR seulement. GitHub les joue sur le résultat de la
  # fusion avec main, et main exige une branche à jour avant fusion : ce qui arrive
  # sur main a déjà été testé tel quel. Sur main, la CI ne fait que déployer
  # (le VPS reconstruit l'image : un build cassé fait échouer le déploiement).
  build:
    name: Build (Next.js + image Docker)
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Docs uniquement — build sauté (check maintenu vert)
        if: needs.changes.outputs.docs == 'true'
        run: echo "Modification purement docs — rien à construire."
      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs != 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.docs != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.docs != 'true'
      - run: npm run build
        if: needs.changes.outputs.docs != 'true'
      - name: Build de l'image Docker (valide le Dockerfile + better-sqlite3 natif)
        if: needs.changes.outputs.docs != 'true'
        run: docker build -t what-shall-we-play:ci .

  test:
    name: Tests (unitaires + E2E)
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Docs uniquement — tests sautés (check maintenu vert)
        if: needs.changes.outputs.docs == 'true'
        run: echo "Modification purement docs — rien à tester."
      - uses: actions/checkout@v5
        if: needs.changes.outputs.docs != 'true'
      - uses: actions/setup-node@v5
        if: needs.changes.outputs.docs != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.docs != 'true'
      - name: Tests unitaires (Vitest)
        if: needs.changes.outputs.docs != 'true'
        run: npm test
      - name: Cache Playwright (Chromium)
        if: needs.changes.outputs.docs != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Chromium (Playwright)
        if: needs.changes.outputs.docs != 'true'
        run: npx playwright install --with-deps chromium
      - name: Tests E2E (Playwright, build de production)
        if: needs.changes.outputs.docs != 'true'
        run: npm run test:e2e
        env:
          E2E_PROD: '1' # next build + next start : ~21 min en serveur dev, quelques minutes ainsi
      - name: Artefacts d'échec (snapshots, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echecs-e2e
          path: test-results/
          retention-days: 7

  deploy:
    name: Déploiement VPS
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS (pull + rebuild + restart)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_DIR }}"
            git pull --ff-only origin main
            docker compose build
            # l'app tourne en utilisateur node (v4.7.4) : data/ (volume de l'hôte) doit lui appartenir
            docker compose run --rm --no-deps --user root --entrypoint chown app -R node:node /app/data
            docker compose up -d
            docker image prune -f

  # Tag annoté de la version de package.json, posé après un déploiement réussi
  # (s'il n'existe pas déjà), puis Release GitHub via release.yml.
  tag:
    name: Tag de version
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Poser le tag v<version> s'il manque
        id: tag
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG existe déjà (version non incrémentée) — rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Release GitHub
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
